plugins {
    id 'java'
    id 'application'
    id 'com.vaadin' version '24.9.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'tech.tablesaw:tablesaw-core:0.44.4'
    implementation 'com.github.haifengl:smile-core:3.0.2'

    // Website: Vaadin, started from Application.main() by Vaadin Boot (no Spring Boot needed)
    implementation 'com.vaadin:vaadin-core:24.9.7'
    implementation 'com.github.mvysny.vaadin-boot:vaadin-boot:13.5'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
}

application {
    mainClass = 'Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('run', JavaExec) {
    workingDir = projectDir
}
